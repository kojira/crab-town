name: pages

on:
  push:
    branches: [main]
    paths: ["web/**", "web-src/**", "scripts/build-web.mjs", "package.json", "pnpm-lock.yaml", "mise.toml", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # node + pnpm from mise.toml
      - uses: jdx/mise-action@v5
      - name: install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: typecheck (tsc, strict)
        run: pnpm typecheck
      - name: build web (web-src/*.ts -> web/*.js)
        run: pnpm build
      - name: generated web/ matches the commit
        run: git diff --exit-code -- web/ && test -z "$(git status --porcelain -- web/)"
      - name: viewer tests (node --test)
        run: pnpm test

      - name: build site (static viewer only; the Nostr page is the entry)
        run: |
          mkdir _site
          cp web/*.js web/nostr.html _site/
          rm _site/ws.js
          cp web/nostr.html _site/index.html
          # cache buster: Pages serves with max-age=600, so pin every local script to this commit
          v="${GITHUB_SHA::7}"
          sed -i -E "s#<script( type=\"module\")? src=\"([a-z]+\.js)\"#<script\1 src=\"\2?v=$v\"#g" _site/index.html _site/nostr.html
          sed -i "s#v:dev#v:$v#" _site/index.html _site/nostr.html
          grep -c "?v=$v" _site/index.html
          grep -c "v:$v" _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deploy
        uses: actions/deploy-pages@v4

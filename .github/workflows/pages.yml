name: pages

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: build site (static viewer only; the Nostr page is the entry)
        run: |
          mkdir _site
          cp web/*.js web/nostr.html _site/
          rm _site/ws.js
          cp web/nostr.html _site/index.html
          # cache buster: Pages serves with max-age=600, so pin every local script to this commit
          v="${GITHUB_SHA::7}"
          sed -i -E "s#<script( type=\"module\")? src=\"([a-z]+\.js)\"#<script\1 src=\"\2?v=$v\"#g" _site/index.html _site/nostr.html
          sed -i "s#v:dev#v:$v#" _site/index.html _site/nostr.html
          grep -c "?v=$v" _site/index.html
          grep -c "v:$v" _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deploy
        uses: actions/deploy-pages@v4

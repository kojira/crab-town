name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # node + pnpm from mise.toml
      - uses: jdx/mise-action@v5
      - name: install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: typecheck (tsc, strict)
        run: pnpm typecheck
      - name: build web (web-src/*.ts -> web/*.js)
        run: pnpm build
      - name: generated web/ matches the commit
        run: |
          git status --porcelain -- web/
          git diff --exit-code -- web/
          test -z "$(git status --porcelain -- web/)"
      - name: generated town-next viewer matches the commit
        run: |
          git diff --exit-code -- internal/nextweb/static/
          test -z "$(git status --porcelain -- internal/nextweb/static/)"
      - name: viewer tests (node --test)
        run: pnpm test
      - name: phone input e2e (Playwright WebKit, iPhone 13)
        run: |
          pnpm exec playwright install --with-deps webkit
          pnpm test:e2e
      - name: town-next viewer e2e (real town-next server; WebKit iPhone 13 + Chromium PC)
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e:next
      - name: go build
        run: go build ./...
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: line count (<= 800 per source file)
        run: bash scripts/check-lines.sh

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>crab-town (Nostr)</title>
<style>
  html { -webkit-text-size-adjust:100%; text-size-adjust:100%; }
  /* iOS Safari zooms in on focus when a form control's text is under 16px:
     keep every control at 16px at every width (no maximum-scale / user-scalable=no) */
  input, select, textarea { font-size:16px; }
  body { background:#1b1d23; color:#ddd; font-family:system-ui,sans-serif; margin:20px; }
  canvas { image-rendering:pixelated; border:2px solid #444; display:block; cursor:crosshair;
           max-width:calc(100vw - 44px); max-height:calc(100vh - 220px); width:auto; height:auto; }
  #bar { margin:8px 0; display:flex; gap:8px; flex-wrap:wrap; align-items:center; font-size:14px; }
  button { background:#2b2e38; color:#ffd84a; border:1px solid #555; padding:4px 10px; border-radius:4px; cursor:pointer; }
  button:disabled { color:#777; cursor:default; }
  select { background:#2b2e38; color:#ddd; border:1px solid #555; border-radius:4px; padding:4px 6px; }
  .knockBox { display:inline-flex; gap:4px; }
  /* talk input sits right under the chat log, like a chat app */
  #talkForm { display:flex; gap:6px; margin-top:6px; }
  #talkText { flex:1; min-width:0; max-width:560px; background:#22252d; color:#ddd; border:1px solid #555; border-radius:4px; padding:4px 8px; }
  #status { margin-top:8px; font-size:14px; }
  #relays, #meta { font:12px monospace; color:#889; }
  #mapwrap { position:relative; }
  #stage { position:relative; }
  #minimap, #jumps, #chatHead { display:none; }
  /* chat log: who said what, newest at the bottom */
  #chat { margin-top:8px; max-width:960px; }
  #log { font:16px/1.5 system-ui,sans-serif; color:#bbb; max-height:160px; overflow:auto; overflow-wrap:anywhere; }
  #log .line { padding:1px 0; white-space:pre-wrap; }
  #log .t { color:#667; font:13px monospace; }
  #log .who { font-weight:bold; }
  #log .resident .who { color:#ffd84a; } #log .a-labomi .who { color:#ff8fbd; }
  #log .owner .who { color:#ffb347; } #log .guest .who { color:#7fc8ff; }
  #log .self .who { color:#8be08b; } #log .self .msg { color:#e8ffe8; }
  #log .system { color:#7a8a7a; font-size:14px; }
  #log .dim { opacity:.5; } #log .err, #log .st.failed { color:#ff6b6b; }
  #log .st { font-size:11px; color:#889; } #log .st.delivered { color:#7fbf7f; }
  #log .retry { font-size:12px; padding:1px 8px; margin-left:4px; color:#ffb3b3; border-color:#a55; }
  #logwrap { position:relative; }
  #newLines { position:absolute; right:12px; bottom:6px; z-index:1; background:#ffd84a; color:#111; border:0; font-weight:bold; }
  /* chat images (owner only): a capped thumbnail that links to the full image */
  #log a.img { display:block; margin:4px 0 2px; width:max-content; max-width:100%; }
  #log a.img img { display:block; max-width:min(240px, 100%); max-height:120px; width:auto; height:auto; object-fit:contain; border:1px solid #444; border-radius:4px; background:#111; }
  /* the file input stays in the label (tappable on iOS Safari), visually hidden but not display:none */
  .pickbtn { position:relative; display:inline-flex; align-items:center; background:#2b2e38; color:#ffd84a; border:1px solid #555; padding:4px 10px; border-radius:4px; cursor:pointer; white-space:nowrap; }
  .pickbtn[hidden] { display:none; } .pickbtn.busy { opacity:.5; pointer-events:none; }
  .pickbtn input { position:absolute; inset:0; width:100%; height:100%; opacity:0; cursor:pointer; font-size:16px; }
  #typing { font-size:12px; color:#ffd84a; padding:2px 0; } #talkHint { font-size:12px; color:#ffb347; margin:4px 0 0; }
  /* narrow screens (set by mobile.js): fixed-scale map you drag around.
     Phones: the page is one column pinned to the visual viewport (--app-h /
     --vv-top from chatlog.js, so the soft keyboard shrinks it): header, map,
     then the chat panel down to the bottom edge -- no band between map and chat.
     The log takes every pixel the panel has; the input stays at the bottom. */
  body.narrow { position:fixed; left:0; right:0; top:var(--vv-top, 0px); height:var(--app-h, 100dvh); margin:0; padding:8px 8px 0;
    box-sizing:border-box; display:flex; flex-direction:column; overflow:hidden; font-size:16px; }
  body.narrow > * { flex:none; }
  body.narrow h1 { font-size:18px; margin:2px 0; } body.narrow h1 small { display:none; }
  /* one swipeable row each, so the big buttons do not eat the map's height */
  body.narrow #bar, body.narrow #jumps { flex-wrap:nowrap; overflow-x:auto; white-space:nowrap; scrollbar-width:none; }
  body.narrow #bar { gap:6px; font-size:15px; margin:4px 0; }
  body.narrow #bar > * { flex:none; }
  body.narrow button { font-size:15px; padding:7px 11px; } body.narrow select { font-size:16px; padding:7px 11px; }
  body.narrow #meta { font-size:13px; }
  body.narrow #mapwrap { min-height:0; overflow:hidden; }
  body.narrow #stage { overflow:hidden; touch-action:none; border:2px solid #444; }
  body.narrow #stage.dragging { cursor:grabbing; }
  body.narrow canvas { max-width:none; max-height:none; border:0; }
  body.narrow #jumps { display:flex; gap:6px; margin:4px 0; }
  body.narrow #jumps > * { flex:none; }
  body.narrow #jumps::before { content:"見る:"; align-self:center; font-size:15px; color:#889; }
  body.narrow #jumps button { color:#cde; }
  body.narrow #minimap { display:block; position:absolute; right:6px; top:6px; border:1px solid #ffd84a99;
    background:#000a; image-rendering:auto; cursor:pointer; z-index:2; }
  /* the status line lies over the bottom of the map (it used to push the chat down); relay dots are a wide-screen detail */
  body.narrow #status { position:absolute; left:2px; right:2px; bottom:2px; margin:0; padding:1px 6px; z-index:1; pointer-events:none;
    background:#15171cb3; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  body.narrow #relays { display:none; }
  body.narrow #chat { flex:1 1 0; min-height:0; display:flex; flex-direction:column; margin:4px -8px 0; max-width:none;
    background:#15171c; border-top:1px solid #444; }
  body.narrow #chat > * { flex:none; }
  body.narrow #chatHead { display:flex; justify-content:space-between; align-items:center; padding:4px 10px; font-size:16px; }
  body.narrow #logwrap { flex:1 1 0; min-height:0; }
  body.narrow #log { font-size:20px; line-height:1.5; height:100%; max-height:none; box-sizing:border-box; padding:0 10px 8px; }
  body.narrow #log .t { font-size:15px; } body.narrow #log .system { font-size:15px; }
  body.narrow #chat.closed #logwrap, body.narrow #chat.closed #newLines { display:none; }
  /* kbup = typing with the keyboard up: the header rows fold away, never the log or the input.
     The map keeps its height (focus / typing / blur must not resize it) */
  body.narrow.kbup h1, body.narrow.kbup #bar, body.narrow.kbup #jumps, body.narrow.kbup #chatHead { display:none; }
  body.narrow #typing, body.narrow #talkHint { padding:0 10px; font-size:14px; } /* the input stays usable when closed */
  body.narrow #talkForm { margin:auto 0 0; padding:6px 10px calc(8px + env(safe-area-inset-bottom, 0px)); border-top:1px solid #333; align-items:stretch; }
  body.narrow #talkText { max-width:none; font-size:17px; padding:8px 10px; min-height:44px; box-sizing:border-box; }
  body.narrow #talk { font-size:17px; min-width:64px; min-height:44px; padding:0 14px; }
  body.narrow .pickbtn { padding:7px 14px; min-height:44px; box-sizing:border-box; }
  body.narrow .pickbtn .lbl { display:none; } body.narrow #log a.img img { max-width:min(240px, 100%); max-height:180px; }
</style>
</head>
<body>
<h1>⚡ crab-town <small style="font-size:14px;color:#889">via Nostr</small> <span id="ver" style="font-size:12px;color:#667">v:dev</span></h1>
<div id="bar">
  <button id="login">NIP-07 でログイン</button>
  <button class="cmd" id="toRoom" disabled>のすたろうの部屋へ</button>
  <button class="cmd" id="toGarden" disabled>庭へ</button>
  <span class="knockBox"><select class="cmd" id="knockTo" aria-label="ノックする家" disabled><option value="nostarou-house">のすたろうの家</option></select>
  <button class="cmd" id="knock" disabled>ノック</button></span>
  <button id="resync">再同期</button>
  <span id="meta">you: <span id="who">-</span> / town: <span id="town">-</span></span>
</div>
<div id="jumps" aria-label="表示位置へジャンプ"></div>
<div id="mapwrap"><canvas id="minimap" width="116" height="40" title="タップでその場所へ"></canvas>
<div id="stage"><canvas id="c" width="1856" height="640"></canvas></div>
<div id="status">connecting...</div></div>
<div id="relays"></div>
<div id="chat"><div id="chatHead"><span>💬 チャット (<span id="chatCount">0</span>)</span>
  <button type="button" id="chatToggle" aria-expanded="true">▼ ログを閉じる</button></div>
<div id="logwrap"><div id="log" role="log" aria-live="polite"></div>
<button type="button" id="newLines" hidden>↓ 新着</button></div>
<div id="typing" hidden></div>
<p id="talkHint">NIP-07 拡張（nos2x・Alby など）でログインすると話せる（今は閲覧のみ）</p>
<form id="talkForm"><input id="talkText" class="cmd" maxlength="280" enterkeyhint="send" placeholder="NIP-07 拡張（nos2x・Alby など）でログインすると話せる" disabled>
  <label id="imgBtn" class="pickbtn" title="画像を貼る（オーナーのみ）" hidden><input type="file" id="imgPick" accept="image/png,image/jpeg,image/gif,image/webp" disabled>🖼<span class="lbl"> 画像</span></label>
  <button class="cmd" id="talk" disabled>話す</button></form></div>
<script src="config.js"></script>
<script src="sprites.js"></script>
<script src="furniture.js"></script>
<script src="floor.js"></script>
<script src="props.js"></script>
<script src="town.js"></script>
<script src="avatar.js"></script>
<script src="chatui.js"></script>
<script src="render.js"></script>
<script src="viewport.js"></script>
<script src="upload.js"></script>
<script src="chatlog.js"></script>
<script src="mobile.js"></script>
<script src="nostrtools.js"></script>
<script type="module" src="nostr.js"></script>

</body>
</html>

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>crab-town (Nostr)</title>
<style>
  body { background:#1b1d23; color:#ddd; font-family:system-ui,sans-serif; margin:20px; }
  canvas { image-rendering:pixelated; border:2px solid #444; display:block; cursor:crosshair;
           max-width:calc(100vw - 44px); max-height:calc(100vh - 220px); width:auto; height:auto; }
  #bar { margin:8px 0; display:flex; gap:8px; flex-wrap:wrap; align-items:center; font-size:14px; }
  button { background:#2b2e38; color:#ffd84a; border:1px solid #555; padding:4px 10px; border-radius:4px; cursor:pointer; }
  button:disabled { color:#777; cursor:default; }
  #talkForm { display:flex; gap:6px; }
  #talkText { width:min(420px, 60vw); background:#22252d; color:#ddd; border:1px solid #555; border-radius:4px; padding:4px 8px; }
  #status { margin-top:8px; font-size:14px; }
  #relays, #meta { font:12px monospace; color:#889; }
  #mapwrap { position:relative; }
  #stage { position:relative; }
  #minimap, #jumps, #chatHead { display:none; }
  /* chat log: who said what, newest at the bottom */
  #chat { margin-top:8px; max-width:960px; }
  #log { font:13px/1.45 system-ui,sans-serif; color:#bbb; max-height:160px; overflow:auto; overflow-wrap:anywhere; }
  #log .line { padding:1px 0; white-space:pre-wrap; }
  #log .t { color:#667; font:11px monospace; }
  #log .who { font-weight:bold; }
  #log .resident .who { color:#ffd84a; } #log .a-labomi .who { color:#ff8fbd; }
  #log .owner .who { color:#ffb347; } #log .guest .who { color:#7fc8ff; }
  #log .self .who { color:#8be08b; } #log .self .msg { color:#e8ffe8; }
  #log .system { color:#7a8a7a; font-size:12px; }
  /* narrow screens (set by mobile.js): fixed-scale map you drag around */
  body.narrow { margin:8px; }
  body.narrow h1 { font-size:18px; margin:4px 0; }
  body.narrow #bar { gap:6px; font-size:13px; }
  body.narrow #talkForm { flex:1 1 100%; } body.narrow #talkText { flex:1; width:auto; font-size:16px; }
  body.narrow #stage { overflow:hidden; touch-action:none; border:2px solid #444; }
  body.narrow #stage.dragging { cursor:grabbing; }
  body.narrow canvas { max-width:none; max-height:none; border:0; }
  body.narrow #jumps { display:flex; gap:6px; flex-wrap:wrap; margin:6px 0; }
  body.narrow #jumps::before { content:"見る:"; align-self:center; font-size:12px; color:#889; }
  body.narrow #jumps button { color:#cde; padding:6px 10px; }
  body.narrow #minimap { display:block; position:absolute; right:6px; top:6px; border:1px solid #ffd84a99;
    background:#000a; image-rendering:auto; cursor:pointer; z-index:2; }
  body.narrow #status, body.narrow #relays { font-size:12px; margin-top:4px; }
  body.narrow { padding-bottom:var(--chat-h, 40vh); }
  body.narrow #chat { position:fixed; left:0; right:0; bottom:0; margin:0; max-width:none; z-index:5;
    background:#15171ccc; backdrop-filter:blur(4px); border-top:1px solid #444; }
  body.narrow #chatHead { display:flex; justify-content:space-between; align-items:center; padding:4px 10px; font-size:13px; }
  body.narrow #log { font-size:15px; line-height:1.5; height:min(22vh, 200px); max-height:none; padding:0 10px 8px; }
  body.narrow #chat.closed #log { display:none; }
</style>
</head>
<body>
<h1>⚡ crab-town <small style="font-size:14px;color:#889">via Nostr</small></h1>
<div id="bar">
  <button id="login">NIP-07 でログイン</button>
  <button class="cmd" id="toRoom" disabled>のすたろうの部屋へ</button>
  <button class="cmd" id="toGarden" disabled>庭へ</button>
  <button class="cmd" id="knock" disabled>ノック</button>
  <button id="resync">再同期</button>
  <form id="talkForm"><input id="talkText" class="cmd" maxlength="280" placeholder="のすたろうに話しかける（平文・公開・280字まで）" disabled>
    <button class="cmd" id="talk" disabled>話す</button></form>
  <span id="meta">you: <span id="who">-</span> / town: <span id="town">-</span></span>
</div>
<div id="jumps" aria-label="表示位置へジャンプ"></div>
<div id="mapwrap"><canvas id="minimap" width="116" height="40" title="タップでその場所へ"></canvas>
<div id="stage"><canvas id="c" width="1856" height="640"></canvas></div></div>
<div id="status">connecting...</div>
<div id="relays"></div>
<div id="chat"><div id="chatHead"><span>💬 チャット (<span id="chatCount">0</span>)</span>
  <button type="button" id="chatToggle" aria-expanded="true">開閉</button></div>
<div id="log" role="log" aria-live="polite"></div></div>
<script src="config.js"></script>
<script src="sprites.js"></script>
<script src="furniture.js"></script>
<script src="floor.js"></script>
<script src="props.js"></script>
<script src="town.js"></script>
<script src="render.js"></script>
<script src="viewport.js"></script>
<script src="chatlog.js"></script>
<script src="mobile.js"></script>
<script type="module" src="nostr.js"></script>
</body>
</html>
